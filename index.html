<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Meow Han Ch’wi Hyang — 음악 아티클 아카이브</title>

    <link
      rel="stylesheet"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />

    <style>
      :root {
        --bg: #ececee;
        --paper: #fff;
        --ink: #161619;
        --ink-2: #6c6c72;
        --ink-3: #a6a6ac;
        --line: #e9e9eb;
        --blue: #c7c7cc;
        --blue-deep: #161619;
        --pink: #d6d6da;
        --lav: #cfcfd4;
        --mint: #d2d2d7;
        --chip: #f4f5f8;
        --radius: 18px;
        --shadow:
          0 1px 2px rgba(43, 44, 52, 0.04), 0 12px 30px rgba(90, 110, 150, 0.08);
        --font:
          "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          system-ui, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        font-family: var(--font);
        color: var(--ink);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      img {
        max-width: 100%;
        display: block;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      input,
      textarea,
      select {
        font-family: inherit;
      }

      .app {
        max-width: 430px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--paper);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(90, 110, 150, 0.1);
      }

      /* 상단바 */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: saturate(160%) blur(10px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand .wm {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
        white-space: nowrap;
        color: var(--ink-2);
      }
      .brand .wm em {
        font-style: normal;
        font-weight: 800;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 24px;
        height: 24px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
      }
      .icon-btn:hover,
      .icon-btn:focus-visible {
        background: var(--chip);
      }
      .icon-btn svg {
        width: 20px;
        height: 20px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 1.6;
      }

      /* 히어로 */
      .hero {
        padding: 20px 20px 8px;
      }
      .hero .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--blue-deep);
        letter-spacing: 0.08em;
        margin-bottom: 11px;
      }
      .hero .eyebrow svg {
        width: 16px;
        height: 16px;
      }
      .hero-card {
        position: relative;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        cursor: pointer;
      }
      .hero-cover {
        aspect-ratio: 4/5;
        position: relative;
      }
      .hero-card:active {
        transform: scale(0.992);
      }
      .hero-veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(43, 44, 52, 0) 38%,
          rgba(43, 44, 52, 0.06) 55%,
          rgba(43, 44, 52, 0.42) 100%
        );
      }
      .hero-text {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 22px;
        color: #fff;
      }
      .hero-text .cat {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.12em;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        padding: 4px 10px;
        border-radius: 999px;
        display: inline-block;
        margin-bottom: 12px;
      }
      .hero-text h1 {
        margin: 0;
        font-size: 29px;
        font-weight: 800;
        line-height: 1.24;
        letter-spacing: -0.025em;
      }
      .hero-text p {
        margin: 10px 0 0;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.88);
        font-weight: 400;
      }

      /* 커버 */
      .cover {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover .sketch {
        position: absolute;
      }
      .cv-blue {
        background: linear-gradient(150deg, #4c4c50, #2a2a2d 55%, #1a1a1d);
      }
      .cv-pink {
        background: linear-gradient(150deg, #57575b, #333336 55%, #202023);
      }
      .cv-lav {
        background: linear-gradient(150deg, #45454a, #262629 55%, #161619);
      }
      .cv-mint {
        background: linear-gradient(150deg, #515156, #2e2e31 55%, #1c1c1f);
      }
      .cv-sky {
        background: linear-gradient(150deg, #3f3f43, #212124 55%, #141416);
      }
      .cv-cream {
        background: linear-gradient(150deg, #5e5e62, #39393c 55%, #252528);
      }
      .cv-black {
        background: #161619;
      }

      /* 칩 */
      .chips-wrap {
        padding: 20px 0 6px;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 0 20px;
        scrollbar-width: none;
      }
      .chips::-webkit-scrollbar {
        display: none;
      }
      .chip {
        flex: 0 0 auto;
        padding: 9px 15px;
        border-radius: 999px;
        background: var(--chip);
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-2);
        white-space: nowrap;
        transition:
          background 0.18s,
          color 0.18s;
        border: 1px solid transparent;
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
      }
      .chip:focus-visible {
        outline: 2px solid var(--blue-deep);
        outline-offset: 2px;
      }

      /* 섹션헤더 */
      .sec-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 26px 20px 6px;
      }
      .sec-head svg {
        width: 19px;
        height: 19px;
      }
      .sec-head h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .sec-head .count {
        margin-left: auto;
        font-size: 12px;
        color: var(--ink-3);
        font-weight: 600;
      }

      /* 리스트 */
      .list {
        padding: 8px 20px 4px;
      }
      .row {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 16px;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        align-items: stretch;
      }
      .row:last-child {
        border-bottom: none;
      }
      .row:active {
        opacity: 0.7;
      }
      .row .thumb {
        width: 96px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow);
        align-self: stretch;
      }
      .row .rtext {
        min-width: 0;
      }
      .row .rtext .rcat {
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-2);
        letter-spacing: 0.06em;
      }
      .row .rtext h3 {
        margin: 6px 0 6px;
        font-size: 15.5px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: -0.01em;
        color: var(--ink);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .row .rtext .rex {
        margin: 0;
        font-size: 12.5px;
        color: var(--ink-2);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .row .rtext .rmeta {
        margin-top: 9px;
        font-size: 11px;
        color: var(--ink-3);
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .empty {
        padding: 40px 20px;
        text-align: center;
        color: var(--ink-3);
        font-size: 13px;
        line-height: 1.7;
      }

      /* 뉴스레터 */
      .news {
        margin: 26px 20px 8px;
        padding: 24px 20px;
        border-radius: var(--radius);
        background: linear-gradient(150deg, #f5f5f6, #ececed);
        position: relative;
        overflow: hidden;
      }
      .news .star-bg {
        position: absolute;
        right: -6px;
        top: -8px;
        opacity: 0.6;
      }
      .news h3 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 800;
      }
      .news p {
        margin: 0 0 14px;
        font-size: 11.5px;
        color: var(--ink-2);
        line-height: 1.5;
        white-space: nowrap;
        letter-spacing: -0.2px;
      }
      .news .field {
        display: flex;
        gap: 8px;
      }
      .news input {
        flex: 1;
        min-width: 0;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #e3e3e6;
        background: #fff;
        font-size: 13px;
        color: var(--ink);
      }
      .news input:focus {
        outline: none;
        border-color: var(--blue-deep);
      }
      .news .sub {
        padding: 12px 16px;
        border-radius: 12px;
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .news .sub:active {
        transform: scale(0.97);
      }
      .news .done {
        font-size: 13px;
        color: var(--blue-deep);
        font-weight: 700;
        padding-top: 2px;
      }

      footer {
        padding: 26px 20px 90px;
        text-align: center;
        color: var(--ink-3);
      }
      footer .fbrand {
        font-size: 14px;
        font-weight: 800;
        color: var(--ink-2);
        margin-bottom: 6px;
      }
      footer .fbrand em {
        font-style: normal;
        color: var(--blue-deep);
      }
      footer .fnote {
        font-size: 11.5px;
        line-height: 1.7;
      }

      /* 글쓰기 플로팅 버튼 */
      .fab {
        position: fixed;
        z-index: 40;
        bottom: 24px;
        left: 50%;
        transform: translateX(calc(215px - 100% - 20px));
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 24px rgba(43, 44, 52, 0.28);
      }
      .fab:active {
        transform: translateX(calc(215px - 100% - 20px)) scale(0.94);
      }
      .fab svg {
        width: 24px;
        height: 24px;
        stroke: #fff;
        fill: none;
        stroke-width: 2;
      }
      @media (max-width: 470px) {
        .fab {
          left: auto;
          right: 20px;
          transform: none;
        }
        .fab:active {
          transform: scale(0.94);
        }
      }

      /* 리더 */
      .reader {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: var(--paper);
        max-width: 430px;
        margin: 0 auto;
        overflow-y: auto;
        transform: translateX(100%);
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        -webkit-overflow-scrolling: touch;
      }
      .reader.open {
        transform: translateX(0);
      }
      .reader-bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .reader-bar .back {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 14px;
        font-weight: 600;
        padding: 6px 6px 6px 2px;
        border-radius: 10px;
      }
      .reader-bar .back svg {
        width: 20px;
        height: 20px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 1.8;
      }
      .reader-bar .rb-actions {
        margin-left: auto;
        display: flex;
        gap: 4px;
      }
      .reader-bar .rb-actions button {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-2);
        padding: 6px 10px;
        border-radius: 9px;
      }
      .reader-bar .rb-actions button:hover {
        background: var(--chip);
      }
      .reader-bar .rb-actions .del {
        color: #c98a97;
      }
      .reader-cover {
        aspect-ratio: 16/10;
        position: relative;
      }
      .article {
        padding: 22px 22px 60px;
      }
      .article .a-cat {
        display: inline-flex;
        align-items: center;
        font-size: 12px;
        font-weight: 700;
        color: var(--blue-deep);
        letter-spacing: 0.06em;
      }
      .article .a-cat::before {
        content: "";
        display: inline-block;
        width: 3px;
        height: 13px;
        background: var(--blue-deep);
        border-radius: 2px;
        margin-right: 8px;
      }
      .article h1 {
        margin: 12px 0 12px;
        font-size: 26px;
        font-weight: 800;
        line-height: 1.3;
        letter-spacing: -0.025em;
      }
      .article .a-meta {
        font-size: 12px;
        color: var(--ink-3);
        font-weight: 500;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 20px;
      }
      .article p {
        font-size: 15px;
        line-height: 1.75;
        color: #3a3b44;
        margin: 0 0 18px;
      }
      .article h4 {
        font-size: 16.5px;
        font-weight: 800;
        margin: 30px 0 11px;
        display: flex;
        align-items: stretch;
        gap: 9px;
        letter-spacing: -0.01em;
      }
      .article h4 .h4-bar {
        flex: 0 0 auto;
        width: 3px;
        background: var(--blue-deep);
        border-radius: 2px;
        align-self: stretch;
        margin: 3px 0;
      }
      .article h4 svg {
        width: 14px;
        height: 14px;
      }
      .article .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 26px;
      }
      .article .tags span {
        font-size: 12px;
        color: var(--ink-2);
        background: var(--chip);
        padding: 6px 11px;
        border-radius: 999px;
        font-weight: 600;
      }
      .article .to-list {
        margin-top: 30px;
        width: 100%;
        padding: 14px;
        border-radius: 14px;
        background: var(--ink);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }

      /* 권한: 비운영자일 때 운영 전용 요소 숨김 */
      body:not(.admin) .admin-only {
        display: none !important;
      }
      .rb-actions .rb-admin {
        display: inline-flex;
        gap: 4px;
      }
      .rb-actions .rb-icon {
        display: grid;
        place-items: center;
        padding: 6px 8px;
        border-radius: 9px;
      }
      .rb-actions .rb-icon svg {
        width: 19px;
        height: 19px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 1.7;
      }

      /* 댓글 */
      .comments {
        margin-top: 34px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }
      .comments .c-head {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 14px;
      }
      .comments .c-head svg {
        width: 16px;
        height: 16px;
        color: var(--blue-deep);
      }
      .comments .c-head h4 {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
      }
      .comments .c-head .cn {
        color: var(--ink-3);
        font-weight: 700;
      }
      .c-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 16px;
      }
      .c-item {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .c-item:last-child {
        border-bottom: none;
      }
      .c-item .c-top {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 4px;
      }
      .c-item .c-name {
        font-size: 13px;
        font-weight: 700;
      }
      .c-item .c-time {
        font-size: 11px;
        color: var(--ink-3);
      }
      .c-item .c-body {
        font-size: 13.5px;
        color: #3a3b44;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .c-item .c-del {
        margin-left: auto;
        font-size: 11px;
        color: var(--ink-3);
        padding: 2px 6px;
        border-radius: 7px;
      }
      .c-item .c-del:hover {
        background: var(--chip);
        color: #c98a97;
      }
      .c-empty {
        font-size: 13px;
        color: var(--ink-3);
        padding: 6px 0 14px;
      }
      .c-form {
        background: var(--chip);
        border-radius: 14px;
        padding: 12px;
      }
      .c-form input {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid #e3e3e6;
        border-radius: 10px;
        background: #fff;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .c-form textarea {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid #e3e3e6;
        border-radius: 10px;
        background: #fff;
        font-size: 13.5px;
        line-height: 1.5;
        resize: vertical;
        margin-bottom: 8px;
      }
      .c-form input:focus,
      .c-form textarea:focus {
        outline: none;
        border-color: var(--blue-deep);
      }
      .c-form .c-submit {
        width: 100%;
        padding: 11px;
        border-radius: 10px;
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }
      .c-form .c-submit:active {
        transform: scale(0.99);
      }

      /* 로그인 모달 */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 80;
        max-width: 430px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
      .modal .veil {
        position: absolute;
        inset: 0;
        background: rgba(43, 44, 52, 0.34);
        opacity: 0;
        transition: opacity 0.22s;
      }
      .modal .box {
        position: relative;
        width: 82%;
        max-width: 320px;
        background: #fff;
        border-radius: 18px;
        padding: 22px 20px;
        box-shadow: var(--shadow);
        transform: translateY(8px) scale(0.98);
        opacity: 0;
        transition:
          transform 0.22s,
          opacity 0.22s;
      }
      .modal.open {
        pointer-events: auto;
      }
      .modal.open .veil {
        opacity: 1;
      }
      .modal.open .box {
        transform: none;
        opacity: 1;
      }
      .modal .box h3 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 800;
      }
      .modal .box p {
        margin: 0 0 14px;
        font-size: 12.5px;
        color: var(--ink-2);
        line-height: 1.5;
      }
      .modal .box input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #e3e3e6;
        border-radius: 12px;
        background: #fbfcfe;
        font-size: 15px;
        text-align: center;
        letter-spacing: 0.15em;
      }
      .modal .box input:focus {
        outline: none;
        border-color: var(--blue-deep);
        background: #fff;
      }
      .modal .mbtns {

      .modal .mbtns button {

        border-radius: 12px;

        font-weight: 700;

      .modal .mbtns .ghost {

      .modal .mbtns .primary {

      /* 테스트 배너 */
      .quiz-banner {
        display: flex;
        align-items: center;
        gap: 14px;
        width: calc(100% - 40px);
        margin: 16px 20px 0;
        padding: 16px 18px;
        border-radius: var(--radius);
        background: #161619;
        box-shadow: var(--shadow);
        text-align: left;
      }
      .quiz-banner:active {
        transform: scale(0.99);
      }
      .qb-stars {
        position: relative;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
      }
      .qb-stars svg:last-child {
        position: absolute;
        top: -2px;
        right: -2px;
      }
      .qb-text {
        flex: 1;
        min-width: 0;
      }
      .qb-eyebrow {
        font-size: 11px;
        font-weight: 700;
        color: var(--blue-deep);
        letter-spacing: 0.04em;
      }
      .qb-title {
        font-size: 16px;
        font-weight: 800;
        margin: 2px 0 3px;
      }
      .qb-desc {
        font-size: 12px;
        color: var(--ink-2);
      }
      .qb-go {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        color: var(--ink-3);
      }

      /* 퀴즈 오버레이 */
      .quiz {
        position: fixed;
        inset: 0;
        z-index: 75;
        background: var(--paper);
        max-width: 430px;
        margin: 0 auto;
        overflow-y: auto;
        transform: translateY(100%);
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        -webkit-overflow-scrolling: touch;
      }
      .quiz.open {
        transform: translateY(0);
      }
      .quiz-bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .quiz-bar .qx {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 9px;
      }
      .quiz-bar .qx svg {
        width: 20px;
        height: 20px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 1.7;
      }
      .qprog {
        flex: 1;
        height: 6px;
        background: var(--chip);
        border-radius: 99px;
        overflow: hidden;
      }
      .qprog span {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--blue), var(--blue-deep));
        border-radius: 99px;
        transition: width 0.3s ease;
      }
      .qcount {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-3);
        min-width: 34px;
        text-align: right;
      }

      .quiz-body {
        padding: 26px 22px 60px;
      }
      .q-num {
        font-size: 12px;
        font-weight: 700;
        color: var(--blue-deep);
        letter-spacing: 0.04em;
        margin-bottom: 10px;
      }
      .q-title {
        font-size: 21px;
        font-weight: 800;
        line-height: 1.4;
        letter-spacing: -0.02em;
        margin-bottom: 22px;
      }
      .q-opts {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .q-opt {
        text-align: left;
        padding: 16px 16px;
        border-radius: 15px;
        background: #fbfcfe;
        border: 1.5px solid #e6e6e9;
        font-size: 14.5px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.45;
        transition:
          border-color 0.15s,
          background 0.15s,
          transform 0.08s;
      }
      .q-opt:hover {
        border-color: var(--blue);
      }
      .q-opt:active {
        transform: scale(0.99);
      }
      .q-opt.sel {
        border-color: var(--ink);
        background: #fff;
      }
      .q-multi-hint {
        font-size: 12px;
        color: var(--ink-3);
        margin: -10px 0 14px;
      }
      .q-next {
        margin-top: 22px;
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        background: var(--ink);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
      .q-next:disabled {
        opacity: 0.4;
      }

      /* 결과 */
      .result {
        padding: 8px 22px 70px;
        text-align: center;
      }
      .r-cover {
        margin: 6px auto 20px;
        width: 150px;
        height: 150px;
        border-radius: 26px;
        position: relative;
        overflow: hidden;
        box-shadow: var(--shadow);
        display: grid;
        place-items: center;

      .r-cover .rc-emoji {
        font-size: 60px;
        filter: saturate(0.9);
      }
      .r-cover .sketch {
        position: absolute;
      }
      .r-eyebrow {
        font-size: 12px;
        font-weight: 700;
        color: var(--blue-deep);
        letter-spacing: 0.05em;
      }
      .r-name {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 6px 0 4px;
      }
      .r-axes {
        display: inline-flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 16px;
      }
      .r-axes span {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--ink-2);
        background: var(--chip);
        padding: 5px 11px;
        border-radius: 99px;
      }
      .r-desc {
        font-size: 14.5px;
        color: #3a3b44;
        line-height: 1.7;
        text-align: left;
        background: #fbfcfe;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .r-badges {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .r-badge {
        flex: 1;
        background: #f2f2f4;
        border-radius: 14px;
        padding: 13px 10px;
      }
      .r-badge .rb-k {
        font-size: 11px;
        color: var(--ink-3);
        font-weight: 700;
        margin-bottom: 3px;
      }
      .r-badge .rb-v {
        font-size: 14px;
        font-weight: 800;
        color: var(--ink);
      }
      .r-reco {
        text-align: left;
        margin-bottom: 22px;
      }
      .r-reco .rr-h {
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 9px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .r-reco .rr-h svg {
        width: 14px;
        height: 14px;
        color: var(--blue-deep);
      }
      .r-reco .rr-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .r-reco .rr-chip {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--blue-deep);
        background: #f0f0f2;
        padding: 8px 13px;
        border-radius: 99px;
      }
      .r-actions {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .r-actions .r-primary {
        padding: 15px;
        border-radius: 14px;
        background: var(--ink);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
      .r-actions .r-ghost {
        padding: 13px;
        border-radius: 14px;
        background: var(--chip);
        color: var(--ink-2);
        font-size: 14px;
        font-weight: 700;
      }
      .r-consent {
        font-size: 11px;
        color: var(--ink-3);
        line-height: 1.6;
        margin-top: 16px;
      }
      .r-shot {
        background: #fff;
        padding: 2px 0 10px;
      }
      .r-brand {
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-3);
        letter-spacing: 0.04em;
        margin-top: 16px;
      }
      .r-shot-img {
        display: none;
        width: 100%;
        border-radius: 16px;
        margin-top: 2px;
      }
      .r-shot-hint {
        display: none;
        font-size: 11px;
        color: var(--ink-3);
        text-align: center;
        margin-top: 8px;
      }

      /* 에디터(글쓰기/수정) */
      .editor {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: var(--paper);
        max-width: 430px;
        margin: 0 auto;
        overflow-y: auto;
        transform: translateY(100%);
        transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .editor.open {
        transform: translateY(0);
      }
      .ed-bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .ed-bar .ttl {
        font-size: 15px;
        font-weight: 800;
      }
      .ed-bar .save {
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 16px;
        border-radius: 10px;
      }
      .ed-bar .cancel {
        font-size: 14px;
        color: var(--ink-2);
        font-weight: 600;
        padding: 6px;
      }
      .ed-body {
        padding: 18px 20px 60px;
      }
      .fld {
        margin-bottom: 16px;
      }
      .fld label {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink-2);
        margin-bottom: 7px;
      }
      .fld input[type="text"],
      .fld textarea,
      .fld select {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #e3e3e6;
        border-radius: 12px;
        background: #fbfcfe;
        font-size: 14px;
        color: var(--ink);
      }
      .fld textarea {
        resize: vertical;
        line-height: 1.65;
      }
      .fld input:focus,
      .fld textarea:focus,
      .fld select:focus {
        outline: none;
        border-color: var(--blue-deep);
        background: #fff;
      }
      .fld .hint {
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 6px;
        line-height: 1.5;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      /* 커버 선택 */
      .cover-pick {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        align-items: center;
      }
      .sw {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 2px solid transparent;
      }
      .sw[aria-pressed="true"] {
        border-color: var(--ink);
      }
      .up-btn {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: var(--chip);
        display: grid;
        place-items: center;
        border: 1px dashed #c7cdd8;
      }
      .up-btn svg {
        width: 20px;
        height: 20px;
        stroke: var(--ink-2);
        fill: none;
        stroke-width: 1.7;
      }
      .up-preview {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 2px solid var(--ink);
      }
      .up-preview img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 메뉴 */
      .menu {
        position: fixed;
        inset: 0;
        z-index: 60;
        max-width: 430px;
        margin: 0 auto;
        pointer-events: none;
      }
      .menu .veil {
        position: absolute;
        inset: 0;
        background: rgba(43, 44, 52, 0.28);
        opacity: 0;
        transition: opacity 0.25s;
      }
      .menu .sheet {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        background: var(--paper);
        border-radius: 0 0 22px 22px;
        padding: 20px;
        transform: translateY(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: var(--shadow);
      }
      .menu.open {
        pointer-events: auto;
      }
      .menu.open .veil {
        opacity: 1;
      }
      .menu.open .sheet {
        transform: translateY(0);
      }
      .menu .mhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .menu .mhead .wm {
        font-size: 16px;
        font-weight: 800;
      }
      .menu .mhead .wm em {
        font-style: normal;
        color: var(--blue-deep);
      }
      .menu nav {
        display: flex;
        flex-direction: column;
      }
      .menu nav button {
        text-align: left;
        padding: 13px 6px;
        font-size: 15px;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .menu nav button:last-child {
        border-bottom: none;
      }
      .menu nav button svg {
        width: 15px;
        height: 15px;
      }

      /* 토스트 */
      .toast {
        position: fixed;
        z-index: 90;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s,
          transform 0.25s;
        box-shadow: 0 8px 24px rgba(43, 44, 52, 0.28);
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .reveal {
        opacity: 0;
        transform: translateY(10px);
        animation: rise 0.5s ease forwards;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* B&W: 세로 바 액센트 + 블랙 배너 */
      .hero .eyebrow .eb-bar {
        display: inline-block;
        width: 3px;
        height: 12px;
        background: var(--blue-deep);
        border-radius: 2px;
      }
      .sec-head .sh-bar {
        display: inline-block;
        flex: 0 0 auto;
        width: 4px;
        height: 18px;
        background: var(--blue-deep);
        border-radius: 2px;
      }
      .quiz-banner .qb-eyebrow {
        color: #c9c9ce;
      }
      .quiz-banner .qb-title {
        color: #fff;
      }
      .quiz-banner .qb-desc {
        color: rgba(255, 255, 255, 0.62);
      }
      .quiz-banner .qb-go {
        color: rgba(255, 255, 255, 0.5);
      }
      .quiz-banner .qb-stars svg {
        color: #fff !important;
      }
      .q-opt:hover {
        border-color: var(--ink);
      }
    </style>
  </head>

      const store = (() => {
        const cloud =
          typeof window !== "undefined" && window.storage
            ? window.storage
            : null;
        const mem = {};
        return {
          async get(k) {
            if (cloud) {
              try {
                const r = await cloud.get(k);
                return r ? r.value : null;
              } catch (e) {
                return null;
              }
            }
            try {
              return localStorage.getItem(k);
            } catch (e) {
              return k in mem ? mem[k] : null;
            }
          },
          async set(k, v) {
            if (cloud) {
              try {
                await cloud.set(k, v);
                return true;
              } catch (e) {
                return false;
              }
            }
            try {
              localStorage.setItem(k, v);
              return true;
            } catch (e) {
              mem[k] = v;
              return true;
            }
          },
          async del(k) {
            if (cloud) {
              try {
                await cloud.delete(k);
                return;
              } catch (e) {
                return;
              }
            }
            try {
              localStorage.removeItem(k);
            } catch (e) {
              delete mem[k];
            }
          },
        };

## 체크 포인트

      /* ===================== 상태 ===================== */

      /* ===================== 유틸 ===================== */
      function esc(s) {
        return (s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function todayStr() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
      }
      function slug(t) {
        return (
          (t || "article")
            .trim()
            .toLowerCase()
            .replace(/[^\w가-힣]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 20) || "article"
        );
      }
      function bodyToHTML(text) {
        return (text || "")
          .split(/\n\s*\n/)
          .map((b) => {
            b = b.trim();
            if (!b) return "";
            if (b.startsWith("## "))
              return `<h4><span class="h4-bar"></span>${esc(b.slice(3).trim())}</h4>`;
            return `<p>${esc(b).replace(/\n/g, "<br/>")}</p>`;

          .join("");

      function coverInner(a) {

      function timeAgo(ts) {
        const s = Math.floor((Date.now() - ts) / 1000);
        if (s < 60) return "방금 전";
        if (s < 3600) return Math.floor(s / 60) + "분 전";
        if (s < 86400) return Math.floor(s / 3600) + "시간 전";
        const d = new Date(ts),
          p = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
      }
      async function renderComments(id) {
        const el = document.getElementById("cList");
        const cnt = document.getElementById("cCount");
        if (!el) return;
        let list = [];
        if (FB_READY) {
          try {
            list = await fbListComments(id);
          } catch (e) {}
        }
        cnt.textContent = list.length;
        if (!list.length) {
          el.innerHTML = `<div class="c-empty">첫 댓글을 남겨보세요.</div>`;
          return;
        }
        el.innerHTML = list
          .map(
            (c) => `<div class="c-item">
    <div class="c-top"><span class="c-name">${esc(c.name || "익명")}</span><span class="c-time">${timeAgo(c.createdAt && c.createdAt.toMillis ? c.createdAt.toMillis() : Date.now())}</span>
      <button class="c-del admin-only" data-id="${c.id}">삭제</button></div>
    <div class="c-body">${esc(c.text)}</div>
  </div>`,
          )
          .join("");
        el.querySelectorAll(".c-del").forEach(
          (b) =>
            (b.onclick = async () => {
              try {
                await fbDeleteComment(id, b.dataset.id);
              } catch (e) {
                toast("삭제 권한이 없어요");
                return;
              }
              renderComments(id);
            }),
        );
      }
      async function addComment(id) {
        const name =
          (document.getElementById("cName").value || "").trim().slice(0, 20) ||
          "익명";
        const text = (document.getElementById("cText").value || "").trim();
        if (!text) {
          document.getElementById("cText").focus();
          return;
        }
        if (!FB_READY) {
          toast("Firebase 설정을 먼저 입력하세요");
          return;
        }
        try {
          await fbAddComment(id, { name, text });
        } catch (e) {
          toast("댓글 등록에 실패했어요");
          return;
        }
        document.getElementById("cName").value = "";
        document.getElementById("cText").value = "";
        track("add_comment", { article_id: id });
        renderComments(id);
        toast("댓글을 등록했어요");
      }
      function closeArticle() {
        reader.classList.remove("open");
        reader.setAttribute("aria-hidden", "true");
        currentReadId = null;
      }
      document.getElementById("readerBack").onclick = closeArticle;
      document.getElementById("editBtn").onclick = () => {
        if (currentReadId) openEditor(currentReadId);
      };
      document.getElementById("delBtn").onclick = async () => {
        if (!currentReadId) return;
        if (!confirm("이 아티클을 삭제할까요?")) return;
        const a = ARTICLES.find((x) => x.id === currentReadId);
        if (!FB_READY) {
          toast("Firebase 설정을 먼저 입력하세요");
          return;
        }
        try {
          await fbDeleteArticle(currentReadId);
        } catch (e) {
          toast("삭제 실패: 권한을 확인하세요");
          return;
        }
        track("delete_article", {
          article_id: currentReadId,
          article_title: a ? a.title : "",
        });
        closeArticle();
        await reloadAndRender();
        toast("삭제했어요");
      };

      /* ===================== 에디터 ===================== */
      const editor = document.getElementById("editor");
      function buildCoverPick() {
        const el = document.getElementById("coverPick");
        let html = `<button type="button" class="sw cv-black" data-grad="cv-black" aria-pressed="${draftCover.type === "gradient" && draftCover.val === "cv-black"}"></button>`;
        html += `<label class="up-btn" title="이미지 업로드"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4 4m4-4l4 4M5 20h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <input type="file" id="edFile" accept="image/*" hidden></label>`;
        el.innerHTML = html;
        if (draftCover.type === "image" && draftCover.img) {
          const p = document.createElement("div");
          p.className = "up-preview";
          p.innerHTML = `<img src="${draftCover.img}" alt="">`;
          el.appendChild(p);
        }
        el.querySelectorAll(".sw").forEach(
          (b) =>
            (b.onclick = () => {
              draftCover = { type: "gradient", val: b.dataset.grad, img: null };
              buildCoverPick();
            }),
        );
        const file = document.getElementById("edFile");
        file.onchange = (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const rd = new FileReader();
          rd.onload = () => {
            draftCover = { type: "image", val: null, img: rd.result };
            buildCoverPick();
          };
          rd.readAsDataURL(f);
        };
      }
      function fillCatSelect(sel) {
        document.getElementById("edCat").innerHTML = CATS.map(
          (c) =>
            `<option value="${c.key}" ${c.key === sel ? "selected" : ""}>${c.label}</option>`,
        ).join("");
      }

      function openEditor(id) {
        editingId = id || null;
        document.getElementById("edTitle").textContent = id
          ? "아티클 수정"
          : "새 아티클";
        if (id) {
          const a = ARTICLES.find((x) => x.id === id);
          fillCatSelect(a.cat);
          document.getElementById("edDate").value = a.date;
          document.getElementById("edTitleInput").value = a.title;
          document.getElementById("edExcerpt").value = a.excerpt;
          document.getElementById("edBody").value = a.body;
          document.getElementById("edTags").value = (a.tags || [])
            .map((t) => t.replace(/^#/, ""))
            .join(", ");
          draftCover =
            typeof a.cover === "string" && a.cover.startsWith("data:")
              ? { type: "image", val: null, img: a.cover }
              : {
                  type: "gradient",
                  val: GRADS.includes(a.cover) ? a.cover : "cv-sky",
                  img: null,
                };
        } else {
          fillCatSelect("playlist");
          document.getElementById("edDate").value = todayStr();
          document.getElementById("edTitleInput").value = "";
          document.getElementById("edExcerpt").value = "";
          document.getElementById("edBody").value = "";
          document.getElementById("edTags").value = "";
          draftCover = { type: "gradient", val: "cv-black", img: null };
        }
        buildCoverPick();
        closeArticle();
        editor.classList.add("open");
        editor.setAttribute("aria-hidden", "false");
        editor.scrollTop = 0;
      }
      function closeEditor() {
        editor.classList.remove("open");
        editor.setAttribute("aria-hidden", "true");
        editingId = null;
      }
      document.getElementById("edCancel").onclick = closeEditor;
      document.getElementById("fab").onclick = () => openEditor(null);

      document.getElementById("edSave").onclick = async () => {
        const title = document.getElementById("edTitleInput").value.trim();
        if (!title) {
          toast("제목을 입력해 주세요");
          document.getElementById("edTitleInput").focus();
          return;
        }
        const cat = document.getElementById("edCat").value;
        const date =
          document.getElementById("edDate").value.trim() || todayStr();
        const excerpt = document.getElementById("edExcerpt").value.trim();
        const body = document.getElementById("edBody").value;
        const tags = document
          .getElementById("edTags")
          .value.split(",")
          .map((s) => s.trim())
          .filter(Boolean)
          .map((s) => (s.startsWith("#") ? s : "#" + s));

        let id = editingId;
        if (!id) {
          id = slug(title) + "-" + Date.now().toString(36).slice(-4);
        }

        // 커버 처리 (base64 또는 그라디언트 키를 그대로 저장)
        const cover =
          draftCover.type === "image" && draftCover.img
            ? draftCover.img
            : draftCover.val || "cv-sky";

        const rec = {
          cat,
          cover,
          title,
          excerpt: excerpt || title,
          date,
          tags,
          body,
        };
        if (!FB_READY) {
          toast("Firebase 설정을 먼저 입력하세요");
          return;
        }
        try {
          if (editingId) {
            await fbUpdateArticle(id, rec);
            track("edit_article", {
              article_id: id,
              article_title: title,
              category: cat,
            });
          } else {
            await fbCreateArticle(id, rec);
            track("create_article", {
              article_id: id,
              article_title: title,
              category: cat,
              has_image: draftCover.type === "image",
            });
          }
        } catch (e) {
          toast("저장 실패: 로그인 상태와 권한을 확인하세요");
          return;
        }
        closeEditor();
        await reloadAndRender();
        toast(editingId ? "수정했어요" : "새 아티클을 올렸어요");
      };

          toast("관리자 로그인 후 이용하세요");
          return;
        }
        try {
          for (const s of SEED) {
            const cover = DEFAULT_COVERS[s.id] || s.cover;
            await fbCreateArticle(s.id, {
              cat: s.cat,
              cover,
              title: s.title,
              excerpt: s.excerpt,
              date: s.date,
              tags: s.tags,
              body: s.body,
            });
          }
        } catch (e) {
          toast("샘플 등록 실패: 권한을 확인하세요");
          return;
        }
        await reloadAndRender();
        toast("샘플 글 4개를 올렸어요");
      }

      /* ===================== 뉴스레터 ===================== */
      document.getElementById("newsBtn").addEventListener("click", async () => {
        const el = document.getElementById("newsInput");
        const v = (el.value || "").trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
          el.focus();
          toast("올바른 이메일 주소를 입력해 주세요");
          return;
        }
        if (!FB_READY) {
          toast("Firebase 설정을 먼저 입력하세요");
          return;
        }
        try {
          await fbAddSubscriber(v);
        } catch (e) {
          toast("구독 등록에 실패했어요");
          return;
        }
        track("newsletter_subscribe", { method: "email" });
        document.getElementById("newsField").innerHTML =
          `<div class="done">✓ 구독 완료 — 새 아티클을 이메일로 보내드릴게요.</div>`;
      });
      async function openSubscribers() {
        if (!FB_READY) {
          toast("Firebase 설정을 먼저 입력하세요");
          return;
        }
        let list = [];
        try {
          list = await fbListSubscribers();
        } catch (e) {
          toast("구독자 목록을 볼 권한이 없어요");
          return;
        }
        let ov = document.getElementById("subsOverlay");
        if (!ov) {
          ov = document.createElement("div");
          ov.id = "subsOverlay";
          document.body.appendChild(ov);
        }
        ov.style.cssText =
          "position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:flex-end;justify-content:center";
        const rows = list.length
          ? list
              .map(
                (s) =>
                  `<div style="display:flex;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid #eee;font-size:14px"><span>${esc(s.email || "")}</span><span style="color:#9a9a9a;font-size:12px">${s.createdAt && s.createdAt.toMillis ? new Date(s.createdAt.toMillis()).toLocaleDateString() : ""}</span></div>`,
              )
              .join("")
          : `<div style="padding:22px 0;color:#9a9a9a;text-align:center">아직 구독자가 없어요.</div>`;
        ov.innerHTML = `<div style="background:#fff;width:100%;max-width:430px;border-radius:18px 18px 0 0;padding:20px 18px 26px;max-height:72vh;overflow:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <strong style="font-size:16px">구독자 (${list.length})</strong>
      <button id="subsClose" style="border:0;background:#f0f0f2;border-radius:10px;padding:7px 13px;font-size:13px;cursor:pointer">닫기</button>
    </div>${rows}</div>`;
        ov.onclick = (e) => {
          if (e.target === ov) ov.remove();
        };
        document.getElementById("subsClose").onclick = () => ov.remove();
      }

      /* ===================== 메뉴 ===================== */
      const menu = document.getElementById("menu");
      function openMenu() {
        menu.classList.add("open");
        menu.setAttribute("aria-hidden", "false");
      }
      function closeMenu() {
        menu.classList.remove("open");
        menu.setAttribute("aria-hidden", "true");
      }
      document.getElementById("menuBtn").onclick = openMenu;
      document.getElementById("menuClose").onclick = closeMenu;
      document.getElementById("menuVeil").onclick = closeMenu;
      function buildMenu() {
        const items = [{ key: "all", label: "전체" }, ...CATS];
        document.getElementById("menuNav").innerHTML =
          items
            .map((c) => `<button data-cat="${c.key}">${c.label}</button>`)
            .join("") +
          `<button data-quiz="1">음악 유형 테스트</button>` +
          `<button class="admin-only" data-write="1">새 글 쓰기</button>` +
          `<button class="admin-only" data-seed="1">샘플 글 불러오기</button>` +
          `<button class="admin-only" data-subs="1">구독자 목록</button>` +
          (isAdmin
            ? `<button data-logout="1">운영자 로그아웃</button>`
            : `<button data-login="1">관리자 로그인</button>`);
        document.querySelectorAll("#menuNav button").forEach(
          (b) =>
            (b.onclick = async () => {
              if (b.dataset.write) {
                closeMenu();
                openEditor(null);
                return;
              }
              if (b.dataset.seed) {
                closeMenu();
                seedSampleArticles();
                return;
              }
              if (b.dataset.subs) {
                closeMenu();
                openSubscribers();
                return;
              }
              if (b.dataset.quiz) {
                closeMenu();
                openQuiz();
                return;
              }
              if (b.dataset.login) {
                closeMenu();
                openLogin();
                return;
              }
              if (b.dataset.logout) {
                await setAdmin(false);
                closeMenu();
                toast("로그아웃했어요");
                return;
              }
              activeCat = b.dataset.cat;
              track("select_category", {
                category: activeCat,
                category_name: catLabel(activeCat),
                source: "menu",
              });
              renderChips();
              renderList();
              closeMenu();
              document
                .querySelector(".sec-head")
                .scrollIntoView({ behavior: "smooth" });
            }),
        );
      }

      /* ===================== 토스트 ===================== */
      let toastTimer;
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
      }

      /* ===================== 관리자 권한 (Firebase Auth) ===================== */
      let isAdmin = false;
      function applyAdmin() {
        document.body.classList.toggle("admin", isAdmin);
        buildMenu();
      }
      async function setAdmin(v) {
        if (!v && FB_READY) {
          try {
            await auth.signOut();
          } catch (e) {}
        }
      }
      if (FB_READY && auth) {
        auth.onAuthStateChanged((u) => {
          isAdmin = !!u;
          applyAdmin();
        });
      }

      const loginModal = document.getElementById("loginModal");
      function openLogin() {
        loginModal.classList.add("open");
        loginModal.setAttribute("aria-hidden", "false");
        const p = document.getElementById("adEmail");
        if (p) setTimeout(() => p.focus(), 80);
      }
      function closeLogin() {
        loginModal.classList.remove("open");
        loginModal.setAttribute("aria-hidden", "true");
      }
      document.getElementById("loginVeil").onclick = closeLogin;
      document.getElementById("pinCancel").onclick = closeLogin;
      document.getElementById("pinOk").onclick = async () => {
        if (!FB_READY) {
          toast("Firebase 설정을 먼저 입력하세요");
          return;
        }
        const email = document.getElementById("adEmail").value.trim();
        const pw = document.getElementById("adPw").value;
        try {
          await auth.signInWithEmailAndPassword(email, pw);
          closeLogin();
          track("admin_login", {});
          toast("운영자 모드로 전환했어요");
        } catch (e) {
          toast("로그인 정보가 올바르지 않아요");
        }
      };
      document.getElementById("adPw").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("pinOk").click();
      });

      const quiz = document.getElementById("quiz");
      let qState = null;
      function openQuiz() {
        qState = {
          i: 0,
          score: { E: 0, R: 0, A: 0, F: 0, S: 0, I: 0 },
          data: {},
          answers: [],
        };
        track("quiz_start", {});
        quiz.classList.add("open");
        quiz.setAttribute("aria-hidden", "false");
        quiz.scrollTop = 0;
        renderQuestion();
      }
      function closeQuiz() {
        quiz.classList.remove("open");
        quiz.setAttribute("aria-hidden", "true");
        qState = null;
      }
      document.getElementById("quizClose").onclick = closeQuiz;
      function setProgress() {
        const total = QUESTIONS.length,
          cur = Math.min(qState.i, total);
        document.getElementById("qprogFill").style.width =
          (cur / total) * 100 + "%";
        document.getElementById("qcount").textContent =
          Math.min(qState.i + 1, total) + "/" + total;
      }
      function renderQuestion() {
        const total = QUESTIONS.length;
        if (qState.i >= total) {
          renderResult();
          return;
        }
        const Q = QUESTIONS[qState.i];
        setProgress();
        let sel = null;
        const body = document.getElementById("quizBody");
        body.innerHTML = `
    <div class="q-num">Q${qState.i + 1}</div>
    <div class="q-title">${Q.q}</div>
    <div class="q-opts">${Q.opts.map((o, idx) => `<button class="q-opt" data-idx="${idx}">${o.t}</button>`).join("")}</div>
    <button class="q-next" id="qNext" disabled>다음</button>`;
        quiz.scrollTop = 0;
        body.querySelectorAll(".q-opt").forEach(
          (b) =>
            (b.onclick = () => {
              sel = +b.dataset.idx;
              body
                .querySelectorAll(".q-opt")
                .forEach((x) => x.classList.remove("sel"));
              b.classList.add("sel");
              document.getElementById("qNext").disabled = false;
            }),
        );
        document.getElementById("qNext").onclick = () => {
          if (sel === null) return;
          const o = Q.opts[sel];
          for (const k in o.ax || {}) qState.score[k] += o.ax[k];
          qState.data[Q.data] = o.v;
          qState.answers.push({ q: Q.id, v: o.v });
          track("quiz_answer", {
            question_id: Q.id,
            answer: String(o.v),
            data_key: Q.data,
          });
          qState.i++;
          renderQuestion();
        };
      }
      function pick(a, b, s) {
        return s[a] >= s[b] ? a : b;
      } // 동점 시 앞 축(E·A·S) 우선
      function computeType() {
        const s = qState.score;
        const key = [
          pick("E", "R", s),
          pick("A", "F", s),
          pick("S", "I", s),
        ].join("-");
        return { key, type: TYPES[key] };
      }
      function renderResult() {
        document.getElementById("qprogFill").style.width = "100%";
        document.getElementById("qcount").textContent = "결과";
        const { key, type } = computeType();
        const genre = qState.data.fav_genre,
          gear = +qState.data.gear_level || 0;
        track("quiz_complete", {
          result_type: key,
          result_name: type.name,
          fav_genre: genre,
          gear_level: gear,
          discovery_channel: qState.data.discovery_channel,
          listen_context: qState.data.listen_context,
          spend_type: qState.data.spend_type,
          axis_E: qState.score.E,
          axis_R: qState.score.R,
          axis_A: qState.score.A,
          axis_F: qState.score.F,
          axis_S: qState.score.S,
          axis_I: qState.score.I,
        });
        track("set_user_properties", {
          music_type: key,
          music_type_name: type.name,
          fav_genre: genre,
          gear_level: gear,
        });
        body.innerHTML = resultBodyHTML(key, type, genre, gear);
        wireResult(key, type, genre, gear);
      }
      function resultBodyHTML(key, type, genre, gear) {
        return `
    <div class="result">
      <div id="rShot" class="r-shot">
        <div class="r-cover ${type.cover}">
          <span class="rc-emoji">${type.emoji}</span>
        </div>
        <div class="r-eyebrow">나의 음악 유형</div>
        <div class="r-name">${type.name}</div>
        <div class="r-axes">${type.axes.map((a) => `<span>${a}</span>`).join("")}</div>
        <div class="r-desc">${type.desc}</div>
        <div class="r-badges">
          <div class="r-badge"><div class="rb-k">선호 장르</div><div class="rb-v">${genreLabel(genre)}</div></div>
          <div class="r-badge"><div class="rb-k">감상 기기</div><div class="rb-v">${GEAR_LABEL[gear]}</div></div>
        </div>
        <div class="r-brand">Meow Han Ch’wi Hyang · 음악 유형 테스트</div>
      </div>
      <div class="r-actions">
        <button class="r-primary" id="rShare">결과 공유하기</button>
        <button class="r-ghost" id="rHome">홈으로 돌아가기</button>
        <button class="r-ghost" id="rRetry">다시 하기</button>
      </div>
    </div>`;
      }
      function wireResult(key, type, genre, gear) {
        quiz.scrollTop = 0;
        document.getElementById("rRetry").onclick = openQuiz;
        document.getElementById("rHome").onclick = () => {
          try {
            history.replaceState(null, "", location.pathname);
          } catch (e) {}
          closeQuiz();
          window.scrollTo({ top: 0 });
        };
        document.getElementById("rShare").onclick = async () => {
          const url =
            location.origin +
            location.pathname +
            "#r/" +
            encodeURIComponent(key + "~" + (genre || "") + "~" + (gear || 0));
          track("quiz_share", { result_type: key, result_name: type.name });
          try {
            await navigator.clipboard.writeText(url);
            toast("결과 링크를 복사했어요");
          } catch (e) {
            try {
              const t = document.createElement("textarea");
              t.value = url;
              t.style.position = "fixed";
              t.style.opacity = "0";
              document.body.appendChild(t);
              t.focus();
              t.select();
              document.execCommand("copy");
              t.remove();
              toast("결과 링크를 복사했어요");
            } catch (_) {
              toast("링크 복사에 실패했어요");
            }
          }
        };
      }
      function showSharedResult(key, genre, gear) {
        const type = TYPES[key];
        if (!type) return;
        quiz.classList.add("open");
        quiz.setAttribute("aria-hidden", "false");
        quiz.scrollTop = 0;
        document.getElementById("qprogFill").style.width = "100%";
        document.getElementById("qcount").textContent = "결과";
        const body = document.getElementById("quizBody");
        body.innerHTML = resultBodyHTML(key, type, genre, gear);
        wireResult(key, type, genre, gear);
        track("quiz_share_view", { result_type: key });
      }
      document.getElementById("quizBanner").onclick = () => openQuiz();

      /* 운영자 진입: 푸터 로고 5번 탭(모바일용) — 공개 메뉴엔 노출 안 함 */
      (function () {
        let n = 0,
          t = 0;
        const el = document.getElementById("footBrand");
        if (el)
          el.addEventListener("click", () => {
            const now = Date.now();
            if (now - t > 2000) n = 0;
            t = now;
            if (++n >= 5) {
              n = 0;
              openLogin();
            }
          });
      })();

      (async function init() {
        await load();
        renderChips();
        applyAdmin();
        renderAll();
        if (HAS_CONFIG && !FB_READY) {
          toast("Firebase 연결 실패 — SDK 로드/설정을 확인하세요");
        }
        const hash = location.hash || "";
        const mr = hash.match(/^#r\/(.+)$/); // 공유 링크: 테스트 결과
        const m = hash.match(/^#a\/(.+)$/); // 공유 링크: 아티클
        if (mr) {
          const p = decodeURIComponent(mr[1]).split("~");
          if (TYPES[p[0]]) showSharedResult(p[0], p[1] || "", +p[2] || 0);
        } else if (m) {
          const id = decodeURIComponent(m[1]);
          if (ARTICLES.find((x) => x.id === id)) openArticle(id, "link");
        } else if (hash === "#quiz") {
          openQuiz();
        } // 공유 링크: 테스트
        track("page_view", {
          page: "home",
          page_title: "Meow Han Ch’wi Hyang",
        });
      })();
    </script>
